_target_: src.models.SwinUNETR_LIDC_module.SwinUNETR_LIDC_Module
defaults:
  - criterion: dice_ce_loss_monai.yaml
  - net: unetrpp.yaml
  - scheduler: reducelr_on_plateau.yaml

ce_loss: 
  _target_: src.models.losses.CE_loss.CELossMonAI
  reduction: mean

dice_loss: 
  _target_: src.models.losses.dice_loss_monai.DiceLossMonAI
  to_onehot_y: False
  sigmoid: True
  softmax: False
  include_background: False

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.00001
  weight_decay: 0.000001

# scheduler:
#   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
#   _partial_: true
#   T_max: ${trainer.max_epochs}
  
# compile model for faster training with pytorch 2.0
compile: false
num_classes: 2 # including background