_target_: src.models.losses.combine_loss.CombineLoss

loss_type: "tversky"
sigmoid: True
to_onehot_y: False
num_classes: ${model.num_classes}
gamma: 0.75 # gamma only for tversky
delta: 0.7 # back ce / fn
softmax: False
reduction: "mean"
include_background: False
epsilon: 1e-7
lambda_dice: 1.0
lambda_focal: 1.0
lambda_lovasz: 1.0
lambda_hd: 5.0