_target_: monai.transforms.Compose

transforms:
  - _target_: monai.transforms.LoadImaged
    keys: ["image", "label"]
    ensure_channel_first: True

  # - _target_: monai.transforms.RandSpatialCropSamplesd
  #   keys: ["image", "label"]
  #   roi_size: ${data.image_size_before_resized}
  #   num_samples: ${data.samples}
  #   random_center: True
  #   random_size: False

  - _target_: monai.transforms.RandCropByPosNegLabeld
    keys: ["image", "label"]
    label_key: "label"
    spatial_size: ${data.image_size_before_resized}
    pos: 1
    neg: 0
    num_samples: ${data.samples} # number of cropped samples
    image_key: "image"
  
  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    prob: 0.5
    spatial_axis: 0

  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    prob: 0.5
    spatial_axis: 2

  - _target_: monai.transforms.RandAffined
    keys: ["image", "label"]
    prob: 0.5
    rotate_range: [0.1, 0.1, 0.1]
    scale_range: [0.02, 0.02, 0.02]
    mode: ["trilinear", "nearest"]

  # - _target_: monai.transforms.Resized
  #   keys: ["image", "label"]
  #   spatial_size: ${data.image_size}
  #   mode: ["trilinear", "nearest"]
  
  - _target_: monai.transforms.ToTensord
    keys: ["image", "label"]