_target_: monai.transforms.Compose

transforms:
  - _target_: monai.transforms.LoadImaged
    keys: ["image", "label"]
    ensure_channel_first: True

  - _target_: monai.transforms.ScaleIntensityRanged
    keys: ["image"]
    a_min: -175
    a_max: 250
    b_min: 0.0
    b_max: 1.0
    clip: True
    
  - _target_: monai.transforms.CropForegroundd
    keys: ["image", "label"]
    source_key: "image"

  - _target_: monai.transforms.Orientationd
    keys: ["image", "label"]
    axcodes: "RAS"

  - _target_: monai.transforms.Spacingd
    keys: ["image", "label"]
    pixdim: [1.5, 1.5, 2.0]
    mode: ["bilinear", "nearest"]
  
  - _target_: monai.transforms.RandCropByPosNegLabeld
    keys: ["image", "label"]
    label_key: "label"
    spatial_size: [96, 96, 96]
    pos: 1
    neg: 1
    num_samples: 3
    image_key: "image"
    image_threshold: 0

  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    spatial_axis: [0]
    prob: 0.10
  
  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    spatial_axis: [1]
    prob: 0.10
  
  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    spatial_axis: [2]
    prob: 0.10

  - _target_: monai.transforms.RandRotate90d
    keys: ["image", "label"]
    prob: 0.10
    max_k: 3

  - _target_: monai.transforms.RandShiftIntensityd
    keys: "image"
    offsets: 0.10
    prob: 0.50

  - _target_: monai.transforms.ToTensord
    keys: ["image", "label"]
