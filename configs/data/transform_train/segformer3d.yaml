_target_: monai.transforms.Compose

transforms:
  - _target_: monai.transforms.RandSpatialCropSamplesd
    keys: ["image", "label"]
    roi_size: [96, 96, 96]
    num_samples: 4
    random_center: True
    random_size: False

  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    prob: 0.30
    spatial_axis: 1

  - _target_: monai.transforms.RandRotated
    keys: ["image", "label"]
    prob: 0.50
    range_x: 0.36
    range_y: 0.0
    range_z: 0.0

  - _target_: monai.transforms.RandCoarseDropoutd
    keys: ["image", "label"]
    holes: 20
    spatial_size: [-1, 7, 7]
    fill_value: 0
    prob: 0.5

  - _target_: monai.transforms.NormaGibbsNoisedlize
    keys: ["image"]

  - _target_: monai.transforms.EnsureTyped
    keys: ["image", "label"]
    track_meta: False