_target_: monai.transforms.Compose

transforms:
  - _target_: monai.transforms.LoadImaged
    keys: ["image", "label"]
    ensure_channel_first: True

  - _target_: monai.transforms.RandSpatialCropd
    keys: ["image", "label"]
    roi_size: [128, 256, 256]
    random_size: False

  # - _target_: monai.transforms.RandCropByPosNegLabeld
  #   keys: ["image", "label"]
  #   label_key: "label"
  #   spatial_size: [128, 256, 256]
  #   pos: 3
  #   neg: 1
  #   num_samples: ${data.samples} # number of cropped samples
  #   image_key: "image"
  #   image_threshold: 0

  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    prob: 0.2
    spatial_axis: 0

  # - _target_: monai.transforms.RandFlipd
  #   keys: ["image", "label"]
  #   prob: 0.2
  #   spatial_axis: 1

  - _target_: monai.transforms.RandFlipd
    keys: ["image", "label"]
    prob: 0.2
    spatial_axis: 2

  - _target_: monai.transforms.RandGridDistortiond
    keys: ["image", "label"]
    prob: 0.2
    num_cells: [4, 4, 4]
    distort_limit: [-0.05, 0.05]
    mode: ["trilinear", "nearest"]

  - _target_: monai.transforms.RandAffined
    keys: ["image", "label"]
    prob: 0.2
    rotate_range: [0.1, 0.1, 0.1]
    scale_range: [0.02, 0.02, 0.02]
    # translate_range: [5, 5, 5]
    mode: ["trilinear", "nearest"]

  - _target_: monai.transforms.RandScaleIntensityd
    keys: "image"
    factors: 0.02
    prob: 0.2

  - _target_: monai.transforms.RandShiftIntensityd
    keys: "image"
    offsets: 0.02
    prob: 0.2

  - _target_: monai.transforms.Resized
    keys: ["image", "label"]
    spatial_size: ${data.image_size}
    mode: ["trilinear", "nearest"]  # Image: trilinear, Label: nearest-neighbor

  - _target_: monai.transforms.ToTensord
    keys: ["image", "label"]