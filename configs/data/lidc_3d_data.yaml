_target_: src.data.LIDC.LIDC_3D_datamodule.LIDC_IDRI_3D_Datamodule

defaults:
  - transform_train: lidc_3d.yaml
  - transform_val: lidc_3d.yaml

data_nodule_dir: "/mnt/nvme1n1/duong.quang.minh/data/Image"
data_clean_dir: "/mnt/nvme1n1/duong.quang.minh/data/Clean/Image"
data_lung_dir: "/mnt/nvme1n1/duong.quang.minh/data/Lung_Segmentation_v2"

